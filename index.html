<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Boutique Fortnite</title>
  <style>
    :root {
      --bg: #07111f;
      --bg2: #0f1b2e;
      --panel: rgba(17, 24, 39, 0.9);
      --panel-2: rgba(30, 41, 59, 0.86);
      --line: rgba(148, 163, 184, 0.2);
      --text: #edf6ff;
      --muted: #9bb1c7;
      --cyan: #30d7ff;
      --gold: #f5d76e;
      --green: #4ade80;
      --shadow: rgba(0, 0, 0, 0.35);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at top, rgba(48, 215, 255, 0.18), transparent 26%),
        linear-gradient(180deg, var(--bg) 0%, var(--bg2) 100%);
      color: var(--text);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      padding: 28px 18px 48px;
    }

    .wrap {
      max-width: 1200px;
      margin: 0 auto;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 26px;
      flex-wrap: wrap;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-mark {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      background: linear-gradient(135deg, #1ec3ff, #0f9ef1);
      display: grid;
      place-items: center;
      box-shadow: 0 10px 24px rgba(30, 195, 255, 0.4);
      font-size: 1.25rem;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 3vw, 3rem);
      letter-spacing: 0.04em;
      color: var(--cyan);
      text-transform: uppercase;
    }

    .status {
      font-size: 0.8rem;
      letter-spacing: 0.08em;
      color: var(--muted);
      text-transform: uppercase;
      border: 1px solid var(--line);
      background: rgba(15, 23, 42, 0.7);
      padding: 8px 14px;
      border-radius: 999px;
    }

    .hero {
      background: linear-gradient(180deg, rgba(15, 23, 42, 0.9), rgba(15, 23, 42, 0.55));
      border: 1px solid var(--line);
      border-radius: 22px;
      padding: 20px 22px;
      box-shadow: 0 12px 26px var(--shadow);
      margin-bottom: 24px;
    }

    .hero-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      flex-wrap: wrap;
    }

    .hero-title {
      font-weight: 800;
      font-size: clamp(1.1rem, 2vw, 1.8rem);
      letter-spacing: 0.03em;
      color: #fff;
      margin: 0;
    }

    .hero-sub {
      color: var(--muted);
      margin: 6px 0 0;
      font-size: 0.96rem;
    }

    .refresh-btn {
      appearance: none;
      border: none;
      border-radius: 12px;
      padding: 12px 18px;
      background: linear-gradient(135deg, var(--cyan), #0089d7);
      color: #03111d;
      font-weight: 800;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      box-shadow: 0 10px 24px rgba(30, 195, 255, 0.35);
    }

    .refresh-btn:hover {
      transform: translateY(-1px);
    }

    .shop-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
      gap: 18px;
    }

    .card {
      background: linear-gradient(180deg, rgba(15, 23, 42, 0.92), rgba(17, 24, 39, 0.96));
      border: 1px solid var(--line);
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 12px 24px rgba(0,0,0,0.25);
      transition: transform 0.18s ease, border-color 0.18s ease;
    }

    .card:hover {
      transform: translateY(-4px);
      border-color: rgba(48, 215, 255, 0.45);
    }

    .card img {
      width: 100%;
      display: block;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      background: linear-gradient(135deg, rgba(16, 185, 129, 0.2), rgba(30, 64, 175, 0.2));
    }

    .card-body {
      padding: 12px 12px 14px;
    }

    .name {
      font-weight: 800;
      font-size: 1rem;
      margin: 0 0 8px;
      min-height: 2.4em;
      line-height: 1.2;
    }

    .meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-top: 8px;
    }

    .price {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-weight: 800;
      color: var(--gold);
      background: rgba(245, 215, 110, 0.08);
      border: 1px solid rgba(245, 215, 110, 0.18);
      padding: 6px 9px;
      border-radius: 999px;
      font-size: 0.82rem;
    }

    .rarity {
      color: var(--green);
      font-size: 0.7rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      opacity: 0.9;
    }

    .empty {
      text-align: center;
      color: var(--muted);
      padding: 40px 20px;
      border: 1px dashed rgba(148, 163, 184, 0.35);
      border-radius: 16px;
      background: rgba(15, 23, 42, 0.5);
    }

    @media (max-width: 640px) {
      body { padding-left: 12px; padding-right: 12px; }
      .hero { padding: 16px 16px; }
      .topbar { align-items: flex-start; }
      .shop-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <div class="brand">
        <div class="brand-mark">🛒</div>
        <h1>Boutique Fortnite</h1>
      </div>
      <div class="status" id="shop-status">Chargement…</div>
    </div>

    <div class="hero">
      <div class="hero-inner">
        <div>
          <p class="hero-title">Mise à jour de la boutique actuelle</p>
          <p class="hero-sub" id="shop-date">Récupération des objets…</p>
        </div>
        <button class="refresh-btn" id="refresh-btn">Actualiser</button>
      </div>
    </div>

    <div id="shop-grid" class="shop-grid"></div>
  </div>

  <script>
    const shopGrid = document.getElementById('shop-grid');
    const shopStatus = document.getElementById('shop-status');
    const shopDate = document.getElementById('shop-date');
    const refreshBtn = document.getElementById('refresh-btn');

    async function loadShop() {
      shopStatus.textContent = 'Chargement…';
      shopGrid.innerHTML = '';

      try {
        const response = await fetch(
          'https://api.allorigins.win/raw?url=' + encodeURIComponent('https://fortnite-api.com/v2/shop/br')
        );

        if (!response.ok) {
          throw new Error('Erreur réseau');
        }

        const json = await response.json();
        const entries = json?.data?.entries || [];

        if (!entries.length) {
          shopGrid.innerHTML = '<div class="empty">Aucune offre disponible pour le moment.</div>';
          shopStatus.textContent = 'Indisponible';
          return;
        }

        shopStatus.textContent = 'En ligne';

        const today = new Date();
        shopDate.textContent = 'Dernière mise à jour : ' + today.toLocaleString('fr-FR', {
          dateStyle: 'medium',
          timeStyle: 'short'
        });

        entries.forEach((entry) => {
          const item = (entry.items && entry.items[0]) || null;
          if (!item) return;

          const name = item.name || 'Objet';
          const price = entry.finalPrice ?? entry.regularPrice ?? 'N/A';
          const icon = item.images?.icon || item.images?.featured || item.images?.background || '';
          const rarity = item.rarity?.displayValue || 'Standard';
          const card = document.createElement('article');
          card.className = 'card';
          card.innerHTML = `
            <img src="${icon}" alt="${name}" onerror="this.src='https://placehold.co/512x512/0f172a/94a3b8?text=Fortnite';" />
            <div class="card-body">
              <div class="name">${name}</div>
              <div class="meta">
                <div class="price">🪙 ${price}</div>
                <div class="rarity">${rarity}</div>
              </div>
            </div>
          `;
          shopGrid.appendChild(card);
        });

        if (!shopGrid.children.length) {
          shopGrid.innerHTML = '<div class="empty">Aucune offre compatible trouvée.</div>';
        }
      } catch (error) {
        shopGrid.innerHTML = '<div class="empty">Impossible de charger la boutique pour le moment.</div>';
        shopStatus.textContent = 'Erreur';
        shopDate.textContent = 'Veuillez réessayer plus tard.';
      }
    }

    refreshBtn.addEventListener('click', loadShop);
    loadShop();
  </script>
</body>
</html>
