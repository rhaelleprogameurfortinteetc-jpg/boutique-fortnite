<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Boutique Fortnite</title>
  <style>
    body {
      background-color: #0f172a;
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 16px;
    }
    header {
      text-align: center;
      margin-bottom: 20px;
    }
    h1 {
      margin: 0;
      color: #00d2ff;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 12px;
    }
    .card {
      background: #1e293b;
      border-radius: 10px;
      padding: 8px;
      text-align: center;
      border: 1px solid #334155;
    }
    .card img {
      width: 100%;
      border-radius: 8px;
    }
    .card .name {
      font-weight: bold;
      font-size: 0.9em;
      margin: 6px 0 2px 0;
    }
    .card .price {
      color: #f59e0b;
      font-size: 0.85em;
    }
  </style>
</head>
<body>

  <header>
    <h1>🛒 Boutique Fortnite</h1>
    <p>Mis à jour en direct</p>
  </header>

  <div id="shop-grid" class="grid">Chargement de la boutique...</div>

  <script>
    async function loadShop() {
      try {
        const response = await fetch('https://api.allorigins.win/raw?url=' + encodeURIComponent('https://fortnite-api.com/v2/shop/br'));
        const json = await response.json();
        const entries = json.data.entries;
        
        const grid = document.getElementById('shop-grid');
        grid.innerHTML = '';

        entries.forEach(entry => {
          if (entry.items && entry.items.length > 0) {
            const item = entry.items[0];
            const name = item.name;
            const icon = item.images.icon || item.images.featured || '';
            const price = entry.finalPrice;

            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
              <img src="${icon}" alt="${name}">
              <div class="name">${name}</div>
              <div class="price">🪙 ${price} V-Bucks</div>
            `;
            grid.appendChild(card);
          }
        });
      } catch (err) {
        document.getElementById('shop-grid').innerText = "Impossible de charger la boutique.";
      }
    }

    loadShop();
  </script>
</body>
</html>
